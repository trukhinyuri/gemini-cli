name: 'Fork CI - Tests'

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  checks: 'write'
  contents: 'read'
  pull-requests: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  lint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Run ESLint'
        run: 'npm run lint'

      - name: 'Run Prettier check'
        run: 'npx prettier --check .'

      - name: 'TypeCheck'
        run: 'npm run typecheck'

  test:
    name: 'Test - Node ${{ matrix.node-version }} (${{ matrix.os }})'
    runs-on: '${{ matrix.os }}'
    needs: 'lint'
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macos-latest'
        node-version:
          - '20.x'
          - '22.x'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js ${{ matrix.node-version }}'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Run tests'
        env:
          NO_COLOR: 'true'
        run: 'npm run test:ci'

      - name: 'Bundle'
        run: 'npm run bundle'

      - name: 'Smoke test bundle'
        run: 'node ./bundle/gemini.js --version'

      - name: 'Upload Test Results'
        if: 'always()'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'test-results-${{ matrix.os }}-node-${{ matrix.node-version }}'
          path: |
            packages/*/junit.xml
            packages/*/coverage
          retention-days: 30

      - name: 'Publish Test Report'
        if: 'always()'
        uses: 'dorny/test-reporter@v1'
        with:
          name: 'Test Results (${{ matrix.os }}, Node ${{ matrix.node-version }})'
          path: 'packages/*/junit.xml'
          reporter: 'java-junit'
          fail-on-error: 'false'

  build-check:
    name: 'Build Check'
    runs-on: 'ubuntu-latest'
    needs: 'lint'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build all packages'
        run: 'npm run build'

      - name: 'Bundle'
        run: 'npm run bundle'

      - name: 'Check bundle size'
        run: |
          BUNDLE_SIZE=$(du -sh ./bundle | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          echo "## Bundle Size: $BUNDLE_SIZE" >> $GITHUB_STEP_SUMMARY

      - name: 'Upload bundle artifact'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'bundle'
          path: 'bundle/'
          retention-days: 7

  ci-status:
    name: 'CI Status'
    if: 'always()'
    needs:
      - 'lint'
      - 'test'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check CI Status'
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Check | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build-check.result }}" != "success" ]]; then
            echo ""
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo ""
          echo "✅ All CI jobs passed!"
